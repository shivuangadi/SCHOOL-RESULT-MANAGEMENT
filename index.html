    <script>
      // Capture beforeinstallprompt early before React mounts (so it is never missed during Auth loading)
      window.__srmsDeferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__srmsDeferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('srms-install-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__srmsDeferredInstallPrompt = null;
      });
    </script>
  </head>
  <body class="font-sans antialiased bg-slate-50 text-slate-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then((registration) => {
              console.log('[SRMS PWA] Service Worker registered with scope:', registration.scope);
              registration.update().catch(() => {});
            })
            .catch((err) => {
              console.warn('[SRMS PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
